backend:
  name: github
  repo: Undertaker9003/photojam-website # Your repo path
  branch: main
  base_url: https://photojam-website.netlify.app/ # This tells the CMS to use the Netlify auth helper
  auth_endpoint: /auth

media_folder: "public/images/uploads" # Where club members' thumbnails will be saved
public_folder: "/images/uploads"

collections:
  - name: "gallery"
    label: "Gallery Events"
    folder: "content/gallery" # Where the data files will be stored
    create: true # Allows members to add NEW events
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Thumbnail Image", name: "image", widget: "image" }
      - { label: "Google Drive Link", name: "link", widget: "string" }
      - { label: "Order Index", name: "index", widget: "number", default: 1 }